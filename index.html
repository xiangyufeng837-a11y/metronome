<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Morandi Metronome</title>
    <style>
        :root {
            /* 莫兰迪色系 (Morandi Palette) */
            --bg-color: #F9F9FB;       /* 极浅灰白背景 */
            --card-bg: #FFFFFF;        /* 纯白卡片 */
            --text-primary: #4A4A4A;   /* 深灰文字 */
            --text-secondary: #9B9B9B; /* 浅灰文字 */
            
            /* 莫兰迪跳色 */
            --accent-main: #7F9EB2;    /* 莫兰迪蓝 - 主控色 */
            --accent-strong: #D9A69F;  /* 莫兰迪粉 - 强拍 */
            --accent-weak: #A7C4B5;    /* 莫兰迪绿 - 弱拍 */
            --dot-inactive: #E0E0E0;   /* 未激活点 */
            
            /* iOS 风格阴影与圆角 */
            --shadow-soft: 0 10px 40px rgba(0, 0, 0, 0.05);
            --shadow-inset: inset 0 2px 4px rgba(0,0,0,0.02);
            --radius-xl: 32px;
            --radius-m: 16px;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* 防止移动端滚动 */
        }

        .app-container {
            width: 90%;
            max-width: 420px;
            background: var(--card-bg);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-soft);
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 550px;
        }

        /* 标题区域 */
        header h1 {
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin: 0;
        }

        /* 可视化指示器 */
        .visualizer {
            display: flex;
            gap: 12px;
            height: 40px;
            align-items: center;
            margin: 20px 0;
        }

        .beat-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background-color: var(--dot-inactive);
            transition: all 0.1s ease;
        }

        .beat-dot.active-strong {
            background-color: var(--accent-strong);
            transform: scale(1.6);
            box-shadow: 0 0 15px rgba(217, 166, 159, 0.6);
        }

        .beat-dot.active-weak {
            background-color: var(--accent-weak);
            transform: scale(1.3);
        }

        /* BPM 显示与滑块 */
        .bpm-container {
            text-align: center;
            width: 100%;
        }

        .bpm-value {
            font-size: 82px;
            font-weight: 200;
            color: var(--text-primary);
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }

        .bpm-label {
            font-size: 14px;
            color: var(--accent-main);
            font-weight: 600;
            letter-spacing: 1px;
            margin-top: 5px;
        }

        .slider-wrapper {
            margin-top: 25px;
            width: 100%;
            padding: 0 10px;
        }

        /* 自定义滑块样式 (iOS Style) */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        
        input[type=range]:focus { outline: none; }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 28px;
            width: 28px;
            border-radius: 50%;
            background: #FFFFFF;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            margin-top: -12px; /* 居中 */
            cursor: pointer;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            background: #E5E5EA;
            border-radius: 2px;
            cursor: pointer;
        }

        /* 控制面板：拍号与音量 */
        .controls-row {
            display: flex;
            justify-content: space-between;
            width: 100%;
            gap: 15px;
        }

        .control-card {
            background: #F2F4F8;
            border-radius: var(--radius-m);
            padding: 15px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .control-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-weight: 500;
        }

        /* 拍号选择器样式 */
        select.ios-select {
            appearance: none;
            background: transparent;
            border: none;
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            text-align: center;
            width: 100%;
            outline: none;
        }

        /* 播放按钮 */
        .play-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #9FB3C8, #7F9EB2);
            border: none;
            box-shadow: 0 10px 25px rgba(127, 158, 178, 0.4);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            margin-top: 20px;
        }

        .play-btn:active {
            transform: scale(0.92);
        }

        .play-btn svg {
            width: 32px;
            height: 32px;
            fill: currentColor;
        }

        /* 状态类 */
        .is-playing {
            background: linear-gradient(135deg, #D9A69F, #C0857E) !important; /* 播放时变粉色 */
            box-shadow: 0 10px 25px rgba(217, 166, 159, 0.4) !important;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>Metronome</h1>
        </header>

        <div class="bpm-container">
            <div class="bpm-value" id="bpmDisplay">120</div>
            <div class="bpm-label">BPM</div>
            <div class="slider-wrapper">
                <input type="range" id="bpmSlider" min="40" max="240" value="120">
            </div>
        </div>

        <div class="visualizer" id="visualizer">
            </div>

        <div class="controls-row">
            <div class="control-card">
                <span class="control-label">拍号 (Time Sig)</span>
                <select id="timeSigSelect" class="ios-select">
                    <option value="2">2/4</option>
                    <option value="3">3/4</option>
                    <option value="4" selected>4/4</option>
                    <option value="5">5/4</option>
                    <option value="6">6/4</option>
                </select>
            </div>

            <div class="control-card">
                <span class="control-label">音量 (Volume)</span>
                <input type="range" id="volumeSlider" min="0" max="100" value="80" style="width: 100%;">
            </div>
        </div>

        <button class="play-btn" id="playBtn">
            <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            <svg id="icon-pause" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
    </div>

<script>
    /**
     * Web Audio API 引擎逻辑
     * 采用 "Lookahead Scheduler" 模式，确保时间精度不受 UI 线程阻塞影响
     */
    
    // 状态变量
    let audioCtx = null;
    let isPlaying = false;
    let bpm = 120;
    let beatsPerMeasure = 4;
    let volume = 0.8;
    
    let currentBeatInBar = 0;
    let nextNoteTime = 0.0; // 下一个音符的绝对时间
    let timerID = null;
    
    // 调度参数
    const lookahead = 25.0; // 调度频率 (ms)
    const scheduleAheadTime = 0.1; // 预读时间 (s)

    // DOM 元素
    const playBtn = document.getElementById('playBtn');
    const iconPlay = document.getElementById('icon-play');
    const iconPause = document.getElementById('icon-pause');
    const bpmSlider = document.getElementById('bpmSlider');
    const bpmDisplay = document.getElementById('bpmDisplay');
    const timeSigSelect = document.getElementById('timeSigSelect');
    const volumeSlider = document.getElementById('volumeSlider');
    const visualizer = document.getElementById('visualizer');

    // 初始化音频上下文 (解决浏览器自动播放策略)
    function initAudioContext() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    // 播放单个音符
    function playTone(time, beatIndex) {
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        // 强弱拍逻辑: 第一拍高音 (1000Hz), 弱拍低音 (800Hz)
        if (beatIndex === 0) {
            osc.frequency.value = 1000; 
        } else {
            osc.frequency.value = 800; 
        }

        // 音量包络 (防止爆音)
        gainNode.gain.setValueAtTime(volume, time);
        gainNode.gain.exponentialRampToValueAtTime(0.001, time + 0.05);

        osc.start(time);
        osc.stop(time + 0.05);

        // 同步视觉效果 (使用 setTimeout 在主线程上延迟执行)
        // 计算音频时间和当前时间的差值，确保视觉与听觉同步
        const drawTime = (time - audioCtx.currentTime) * 1000;
        setTimeout(() => {
            updateVisualizer(beatIndex);
        }, Math.max(0, drawTime));
    }

    // 计算下一个音符时间
    function nextNote() {
        const secondsPerBeat = 60.0 / bpm;
        nextNoteTime += secondsPerBeat;
        
        currentBeatInBar++;
        if (currentBeatInBar >= beatsPerMeasure) {
            currentBeatInBar = 0;
        }
    }

    // 调度器：检查是否需要将音符加入队列
    function scheduler() {
        // 当下一个音符的时间在当前时间 + 预读范围内时，进行调度
        while (nextNoteTime < audioCtx.currentTime + scheduleAheadTime) {
            playTone(nextNoteTime, currentBeatInBar);
            nextNote();
        }
        timerID = setTimeout(scheduler, lookahead);
    }

    // --- UI 更新与交互逻辑 ---

    // 更新视觉指示器
    function updateVisualizer(beatIndex) {
        const dots = document.querySelectorAll('.beat-dot');
        // 重置所有点
        dots.forEach(d => {
            d.className = 'beat-dot';
        });
        
        // 激活当前点
        if (dots[beatIndex]) {
            if (beatIndex === 0) {
                dots[beatIndex].classList.add('active-strong');
            } else {
                dots[beatIndex].classList.add('active-weak');
            }
        }
    }

    // 重绘圆点数量
    function drawDots() {
        visualizer.innerHTML = '';
        for (let i = 0; i < beatsPerMeasure; i++) {
            const dot = document.createElement('div');
            dot.className = 'beat-dot';
            visualizer.appendChild(dot);
        }
    }

    // 播放/暂停控制
    playBtn.addEventListener('click', () => {
        isPlaying = !isPlaying;

        if (isPlaying) {
            initAudioContext();
            currentBeatInBar = 0;
            nextNoteTime = audioCtx.currentTime + 0.05;
            scheduler();
            
            // 样式更新
            playBtn.classList.add('is-playing');
            iconPlay.style.display = 'none';
            iconPause.style.display = 'block';
        } else {
            clearTimeout(timerID);
            
            // 样式更新
            playBtn.classList.remove('is-playing');
            iconPlay.style.display = 'block';
            iconPause.style.display = 'none';
        }
    });

    // BPM 滑块
    bpmSlider.addEventListener('input', (e) => {
        bpm = parseInt(e.target.value);
        bpmDisplay.innerText = bpm;
    });

    // 拍号选择
    timeSigSelect.addEventListener('change', (e) => {
        beatsPerMeasure = parseInt(e.target.value);
        currentBeatInBar = 0; // 重置计数
        drawDots(); // 重绘圆点
    });

    // 音量控制
    volumeSlider.addEventListener('input', (e) => {
        volume = parseInt(e.target.value) / 100;
    });

    // 初始化
    drawDots();

</script>
</body>
</html>
